default = "on"
authority = ["simplicity"]
constitution = ">=1"
level = "project"
check = "none"
uses = ["instructions", "review"]

[title]
en = "Write each test as a test_ function in a tests/*_test.sh file"

[text.statement]
en = "Write each test as a bash function whose name starts with `test_`, in a file `tests/<name>_test.sh`, and put the helpers shared by several test files in `tests/lib.sh`."

[text.reason]
en = '''
`tests/run.sh` runs every `test_*` function of `tests/*_test.sh`, each in a bash process of its own with `set -euo pipefail` after sourcing `tests/lib.sh`, so that state set up by one test never reaches another. `tests/run.sh '<pattern>'` runs only the tests whose name matches that bash pattern.
'''

[text.verification]
en = '''
Violated when a test lives elsewhere or under another name, so that `tests/run.sh` does not run it, or when a helper used by several test files is copied into each of them instead of `tests/lib.sh`.
'''
