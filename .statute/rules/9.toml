[title]
en = "In a pull request that changes all-green, check that a wrongly skipped job still fails it"

[text.statement]
en = "When you review a pull request that changes `all-green/`, check that `all-green` at its head still fails when a job was skipped although `changes` said its group had to run."

[text.reason]
en = '''
`check` in `ci.yml` runs `./all-green` from the same checkout, so a pull request that changes `all-green/` is judged by its own version. A step before it fails `check` on any failed or cancelled job whatever `all-green` says, but a job skipped although its group had to run is caught only by `./all-green`.
'''

[text.verification]
en = '''
A test in `tests/all_green_test.sh` that covers the case, passing at the head, is such a check.

Violated when a verdict of LGTM on a pull request that changes `all-green/` does not say how this case was checked at the reviewed head.
'''
