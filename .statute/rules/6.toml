[title]
en = "Let tests reach gh only through a stub, never GitHub"

[text.statement]
en = "In `tests/`, put a stub for `gh` first on `PATH` before running the code under test, so that no test calls GitHub."

[text.reason]
en = '''
A test that called GitHub would pass or fail with the network, the token and the state of a real repository instead of with the code, and would need a credential to run.
'''

[text.verification]
en = '''
Violated when a test runs code that calls `gh` without a stub in its place, or calls `gh` or the GitHub API itself.
'''
