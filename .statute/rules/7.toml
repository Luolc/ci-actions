[title]
en = "The checks a change touches, by what it changes"

[text.statement]
en = "The checks a change here touches are the commit hooks on all files (`uvx pre-commit run --all-files`) for every change, and `tests/run.sh` as well for a change to `changes/`, `all-green/`, `release-ci-green/`, `tests/`, `.github/` or `.pre-commit-config.yaml`."

[text.reason]
en = '''
{@rule:R53} asks for the checks a change touches, as the project's instructions list them; this is that list. It follows the groups `ci.yml` gives `changes`: `test` runs for those paths, and `lint` runs the hooks on every change.
'''

[text.verification]
en = '''
`uvx pre-commit install`, once after cloning, installs the hooks. They run gitleaks on the staged changes, then shellcheck, then `statute compile --check`. In CI, `lint` first runs the gitleaks action on the commits of the pull request or push, then the hooks on all files with gitleaks skipped. A new behavior gets a test that fails without it.

Violated when a change is pushed without a check this list gives for the paths it changes having passed on the pushed version.
'''
