# Commit hooks: secret scan of the staged changes, then shellcheck, then the
# statute compile check.
repos:
  # First, so that a secret is stopped before any other hook runs. The
  # upstream entry already has --staged and --redact; --redact is repeated so
  # that a rev bump cannot silently drop it. On a rev bump, check that the
  # upstream entry still ends in --staged.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--redact", "--no-banner", "."]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  # AGENTS.md and the skills statute copies and links must match a fresh
  # compile of statute.toml and statute.lock; the private output, which git
  # ignores, is not compared. rev must name the statute version in
  # statute.lock: statute refuses a lock another version wrote, so the hook
  # fails until the two agree.
  - repo: https://github.com/Luolc/statute-pre-commit
    rev: v0.1.25
    hooks:
      - id: statute-compile
